<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خريطة الجبر الخطي التفاعلية</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f4f8;--ink:#1c2233;--mut:#5b6478;--card:#fff;--line:#d5d9e5;--red:#e0293f}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--ink:#e8ebf3;--mut:#9aa3b8;--card:#1b202c;--line:#39415a}}
:root[data-theme="dark"]{--bg:#12151d;--ink:#e8ebf3;--mut:#9aa3b8;--card:#1b202c;--line:#39415a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI","Noto Naskh Arabic",Tahoma,sans-serif;padding-bottom:190px}
header{padding:12px 14px 4px;text-align:center}
header h1{margin:0;font-size:19px}header p{margin:4px 0 0;font-size:13.5px;color:var(--mut)}
.tabs{display:flex;gap:8px;justify-content:center;padding:8px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scroll{overflow:auto;padding:0 10px}
.map{position:relative;min-width:1000px;background:#fff;border-radius:12px;border:1px solid var(--line);direction:ltr}
.map img{display:block;width:100%;height:auto}
.dot{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;padding:0;border:0;background:transparent;cursor:pointer;border-radius:50%}
.dot::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1px var(--red);transition:transform .15s}
.dot:hover::before{transform:scale(1.25)}
.dot.on::before{transform:scale(1.5);box-shadow:0 0 0 4px rgba(224,41,63,.35)}
.dot.pulse::after{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid var(--red);animation:p 1.8s infinite}
@keyframes p{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:3px solid var(--red);box-shadow:0 -6px 24px rgba(0,0,0,.18);transform:translateY(0);z-index:5;min-height:120px}
.sheet h2{margin:0 0 4px;font-size:17px;color:var(--red)}
.sheet p{margin:0;font-size:16.5px;max-width:820px}
.sheet .x{position:absolute;top:8px;left:10px;border:0;background:transparent;color:var(--mut);font-size:22px;cursor:pointer;line-height:1}
.hint{color:var(--mut)}
</style></head><body>
<header><h1>خريطة الجبر الخطي التفاعلية</h1><p>اضغطي على النقطة الحمراء 🔴 تحت أي مربع وبيطلع لك الشرح المبسط</p></header>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-p="p1">الصفحة 1: المعادلات والمصفوفات</button><button role="tab" aria-selected="false" data-p="p2">الصفحة 2: المحددات</button></div>
<div class="scroll"><div class="map" id="map"><img id="bg" alt="خريطة مفاهيم الجبر الخطي" src=""></div></div>
<div class="sheet" id="sheet"><button class="x" id="cl" aria-label="إغلاق">×</button><h2 id="st">اختاري نقطة</h2><p id="sx" class="hint">اضغطي أي نقطة حمراء في الخريطة.</p></div>
<script>
const DATA={"p1": [{"id": "core", "l": 60.084, "t": 7.363, "title": "الجبر الخطي", "txt": "المادة ثلاث خطوات مترابطة: ① نحل أنظمة المعادلات ← ② نتعامل مع المصفوفات ونعكسها ← ③ نحسب المحدد. كل قسم يعتمد على اللي قبله."}, {"id": "A0", "l": 32.353, "t": 17.34, "title": "أنظمة المعادلات الخطية", "txt": "نظام المعادلات الخطية: مجموعة معادلات فيها نفس المجاهيل (x, y, z…)، ونبي القيم اللي تحقق كل المعادلات مع بعض."}, {"id": "B0", "l": 86.975, "t": 17.34, "title": "جبر المصفوفات والمعكوس", "txt": "المصفوفات: نجمع ونضرب ونحسب المنقول، ونتعلم المعكوس اللي نستخدمه نحل المعادلات."}, {"id": "C0", "l": 65.126, "t": 93.349, "title": "المحددات", "txt": "المحدد (Determinant): رقم نحسبه من مصفوفة مربعة فقط. نكتبه det(A) أو |A|."}, {"id": "A1", "l": 23.95, "t": 28.147, "title": "متسق", "txt": "متسق (Consistent): النظام له حل واحد على الأقل، يعني إما حل وحيد أو حلول لا نهائية."}, {"id": "A2", "l": 38.235, "t": 28.147, "title": "غير متسق", "txt": "غير متسق (Inconsistent): ما له أي حل. مثال: x+y=3 و x+y=1 مستحيل، لأن المجموع ما يكون ٣ و١ في نفس الوقت."}, {"id": "A3", "l": 11.345, "t": 40.855, "title": "حل وحيد", "txt": "حل وحيد: الخطين يتقاطعون في نقطة وحدة. مثال: x+y=3 و x−y=−1 ← نجمعهم: 2x=2 يعني x=1 و y=2."}, {"id": "A4", "l": 23.95, "t": 40.855, "title": "حلول لا نهائية", "txt": "حلول لا نهائية: الخطين منطبقين على بعض (المعادلة الثانية = الأولى × 2). نكتب الحل بمتغير t: x=3−t ، y=t."}, {"id": "A5", "l": 38.235, "t": 40.855, "title": "لا حل", "txt": "لا يوجد حل: الخطين متوازيين وما يتقاطعون أبدًا."}, {"id": "A6", "l": 17.227, "t": 51.544, "title": "المصفوفة الموسعة", "txt": "المصفوفة الموسعة [A|b]: نكتب أرقام المعادلات (المعاملات + الطرف الأيمن) في مصفوفة بدون ما نعيد كتابة x و y. حجم المصفوفة m×n = عدد الصفوف × عدد الأعمدة."}, {"id": "A9", "l": 38.235, "t": 51.544, "title": "العمليات على الصفوف", "txt": "ثلاث عمليات مسموحة على الصفوف: ① تبديل صفين ② ضرب صف في رقم c لا يساوي صفر ③ إضافة مضاعف صف إلى صف ثاني. هذي ما تغيّر حل النظام."}, {"id": "A7", "l": 18.067, "t": 65.796, "title": "حذف غاوس", "txt": "حذف غاوس: نطبق العمليات على الصفوف لين نوصل للشكل الدرجي (row-echelon)، وبعدين نحل من تحت لفوق بالتعويض الخلفي (back-substitution)."}, {"id": "A8", "l": 38.235, "t": 65.796, "title": "غاوس–جوردان", "txt": "غاوس–جوردان: نكمل الاختزال لين نوصل للشكل الدرجي المختزل (reduced)، فيطلع الحل مباشرة بدون تعويض خلفي."}, {"id": "B1", "l": 62.605, "t": 28.979, "title": "عمليات المصفوفات", "txt": "العمليات: جمع، ضرب في رقم، ضرب مصفوفتين AB، والمنقول Aᵀ (الصفوف تصير أعمدة). ملاحظة: AAᵀ دايمًا متماثلة (symmetric)."}, {"id": "B3", "l": 79.412, "t": 28.979, "title": "قابلة للعكس", "txt": "مصفوفة قابلة للعكس (Invertible): لها معكوس A⁻¹ يحقق AA⁻¹ = A⁻¹A = I. لازم تكون مربعة، والمعكوس وحيد (ما له إلا واحد)."}, {"id": "B4", "l": 96.218, "t": 28.979, "title": "منفردة", "txt": "مصفوفة منفردة (Singular): ما لها معكوس. لو طبقنا غاوس–جوردان على [A|I] ما نقدر نحوّل A إلى I (يطلع صف كله أصفار على اليسار)."}, {"id": "B6", "l": 62.605, "t": 42.637, "title": "إيجاد المعكوس", "txt": "لإيجاد المعكوس: نكتب [A | I] ونطبق غاوس–جوردان لين يصير [I | A⁻¹]. الجزء اليمين هو المعكوس. وإذا ما قدرنا نوصل A إلى I فهي منفردة. تأكد بالضرب: AA⁻¹ = I."}, {"id": "B5", "l": 76.891, "t": 42.637, "title": "الاختصار ينفع", "txt": "الاختصار (Cancellation): إذا C قابلة للعكس وكان AC = BC، نختصر ونقول A = B (نضرب الطرفين في C⁻¹)."}, {"id": "B2", "l": 96.218, "t": 42.637, "title": "الاختصار ما ينفع", "txt": "الاختصار ما ينفع دايمًا: إذا C ما لها معكوس، AC = BC ما يعني A = B. وكذلك AB = O ما يعني أن A = O أو B = O (عكس الأعداد العادية!)."}, {"id": "B10", "l": 62.605, "t": 56.295, "title": "معكوس 2×2", "txt": "مصفوفة 2×2: A = [a b ; c d] قابلة للعكس فقط إذا ad − bc ≠ 0، وقتها المعكوس = 1/(ad−bc) × [d −b ; −c a]. نبدّل عنصري القطر الرئيسي ونغيّر إشارة الباقيين."}, {"id": "B9", "l": 76.891, "t": 56.295, "title": "حل Ax = b", "txt": "حل Ax = b: إذا A قابلة للعكس فللنظام حل وحيد x = A⁻¹b. مفيد لما يكون عندك أكثر من نظام لهم نفس A (نحسب المعكوس مرة وحدة)."}, {"id": "B8", "l": 96.218, "t": 57.957, "title": "قوانين المعكوس", "txt": "قوانين المعكوس: (A⁻¹)⁻¹ = A ، (Aᵏ)⁻¹ = (A⁻¹)ᵏ ، (cA)⁻¹ = (1/c)A⁻¹ ، (Aᵀ)⁻¹ = (A⁻¹)ᵀ ، و(AB)⁻¹ = B⁻¹A⁻¹ (الترتيب ينعكس!)."}], "p2": [{"id": "C0", "l": 63.445, "t": 10.214, "title": "المحددات", "txt": "المحدد (Determinant): رقم نحسبه من مصفوفة مربعة فقط. نكتبه det(A) أو |A|."}, {"id": "C1", "l": 34.874, "t": 25.416, "title": "محدد الرتبة 1 و 2", "txt": "مصفوفة 1×1: المحدد هو العنصر نفسه. مصفوفة 2×2: |A| = a₁₁a₂₂ − a₂₁a₁₂ (ضرب القطر الرئيسي ناقص ضرب القطر الثاني). ممكن يطلع موجب أو صفر أو سالب."}, {"id": "C2", "l": 56.723, "t": 25.416, "title": "الصغرى Mᵢⱼ", "txt": "الصغرى (Minor) Mᵢⱼ: نحذف الصف i والعمود j من A، ونحسب محدد المصفوفة اللي بقت."}, {"id": "C3", "l": 76.891, "t": 25.416, "title": "المرافق Cᵢⱼ", "txt": "المرافق (Cofactor): Cᵢⱼ = (−1)^(i+j) × Mᵢⱼ. يعني نفس الصغرى لكن نضيف الإشارة حسب موقع العنصر."}, {"id": "C6", "l": 96.218, "t": 25.416, "title": "نمط الإشارات", "txt": "نمط الإشارات مثل رقعة الشطرنج: + − + … إذا i+j زوجي فالإشارة +، وإذا فردي فالإشارة −."}, {"id": "C5", "l": 76.891, "t": 39.074, "title": "مفكوك المرافقات", "txt": "مفكوك المرافقات (نظرية 3.1): |A| = مجموع (كل عنصر × مرافقه) على أي صف أو أي عمود تختاره. الأسهل تختار الصف/العمود اللي فيه أكثر أصفار."}, {"id": "C7", "l": 34.874, "t": 52.019, "title": "المصفوفة المثلثية", "txt": "المصفوفة المثلثية (علوية أو سفلية أو قطرية): المحدد = حاصل ضرب عناصر القطر الرئيسي مباشرة، بدون مفكوك."}, {"id": "C8", "l": 65.966, "t": 52.019, "title": "عمليات الصفوف والمحدد", "txt": "نظرية 3.3: عمليات الصفوف تغيّر المحدد بطريقة معروفة (الثلاث تحت). نستخدمها نصفّر عناصر أو نوصل لمصفوفة مثلثية عشان الحساب يسهل."}, {"id": "C10", "l": 96.218, "t": 52.019, "title": "المحدد = 0", "txt": "نظرية 3.4: المحدد = 0 إذا: صف أو عمود كله أصفار، أو صفين/عمودين متساويين، أو صف/عمود مضاعف لصف/عمود ثاني. وأحيانًا نوصل لها بعد عمليات الصفوف (مثال 4)."}, {"id": "C9a", "l": 45.378, "t": 62.827, "title": "تبديل صفين", "txt": "تبديل صفين: المحدد يضرب في −1 (تنقلب الإشارة)."}, {"id": "C9b", "l": 59.664, "t": 62.827, "title": "إضافة مضاعف صف", "txt": "إضافة مضاعف صف إلى صف آخر: المحدد ما يتغير أبدًا. هذي أكثر عملية نستخدمها لتصفير العناصر."}, {"id": "C9c", "l": 73.95, "t": 62.827, "title": "ضرب صف في c", "txt": "ضرب صف في c (≠ 0): المحدد يضرب في c. ونقدر نعكسها: نسحب عامل مشترك من صف قدام المحدد. مثال: |2 4 ; 1 3| = 2 × |1 2 ; 1 3|."}, {"id": "C11", "l": 96.218, "t": 62.827, "title": "العمليات على الأعمدة", "txt": "العمليات على الأعمدة: نفس القواعد تمامًا (نظرية 3.3 و 3.4) تنطبق على الأعمدة. مصفوفتين 'متكافئتين عموديًا' إذا وحدة تطلع من الثانية بعمليات أعمدة."}, {"id": "p1a", "l": 16.218, "t": 82.185, "title": "الصغرى", "txt": "الصغرى = المحدد الصغير بس، بدون إشارة."}, {"id": "p1b", "l": 33.025, "t": 82.185, "title": "المرافق", "txt": "المرافق = الصغرى × (−1)^(i+j). الفرق الوحيد هو الإشارة، وهي اللي نحتاجها في مفكوك المحدد."}, {"id": "p2a", "l": 48.319, "t": 82.185, "title": "عمليات الصفوف على النظام", "txt": "على النظام: العمليات الثلاث ما تغيّر مجموعة الحلول."}, {"id": "p2b", "l": 65.126, "t": 82.185, "title": "عمليات الصفوف على المحدد", "txt": "على المحدد: التبديل ×(−1) ، إضافة مضاعف ×1 (ما يتغير) ، ضرب صف في c ×c."}, {"id": "p3a", "l": 80.42, "t": 82.185, "title": "(AB)⁻¹", "txt": "(AB)⁻¹ = B⁻¹A⁻¹ : ينعكس ترتيب الضرب."}, {"id": "p3b", "l": 97.227, "t": 82.185, "title": "A⁻¹B⁻¹", "txt": "A⁻¹B⁻¹ عادةً ما تساوي (AB)⁻¹ — خطأ شائع في الاختبار!"}, {"id": "p4a", "l": 16.218, "t": 92.28, "title": "متسق", "txt": "متسق = حل واحد أو حلول كثيرة. مو لازم يكون وحيد."}, {"id": "p4b", "l": 33.025, "t": 92.28, "title": "Ax=b مع A قابلة للعكس", "txt": "إذا A قابلة للعكس فالنظام Ax = b له حل واحد بالضبط."}, {"id": "p5a", "l": 48.319, "t": 92.28, "title": "الاختصار في الأعداد", "txt": "في الأعداد: ac = bc تعني a = b إذا c ≠ 0."}, {"id": "p5b", "l": 65.126, "t": 92.28, "title": "الاختصار في المصفوفات", "txt": "في المصفوفات: نحتاج أن C قابلة للعكس (مو بس 'غير صفر')."}]};
